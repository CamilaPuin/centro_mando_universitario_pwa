services:
  - type: web
    name: centro-mando-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://camilapuin.github.io
      - key: JWT_SECRET_KEY
        sync: false
