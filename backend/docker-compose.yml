services:
  app:
    container_name: centro-mando-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/centro_mando?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_FLYWAY_ENABLED=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - centro-mando-net

  db:
    image: mysql:8.0
    container_name: centro-mando-db
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      - MYSQL_DATABASE=centro_mando
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centro-mando-net

  adminer:
    image: adminer:latest
    container_name: centro-mando-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - centro-mando-net

volumes:
  mysql_data:

networks:
  centro-mando-net:
    driver: bridge
