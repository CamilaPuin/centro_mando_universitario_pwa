services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-centro_mando}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-centro_mando}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password-change-me}
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - centro-mando-net

  db:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centro_mando}
      POSTGRES_USER: ${POSTGRES_USER:-centro_mando}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centro_mando} -d ${POSTGRES_DB:-centro_mando}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centro-mando-net

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      - db
    networks:
      - centro-mando-net

volumes:
  postgres_data:

networks:
  centro-mando-net:
    driver: bridge
